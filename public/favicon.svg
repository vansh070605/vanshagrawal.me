<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <style>
      
      .circle-bg {
        fill: #818CF8;
        transition: fill 0.3s;
      }
      
      .logo-text {
        font-family: Georgia, 'Times New Roman', serif;
        font-style: italic;
        font-weight: 700;
        fill: #FFFFFF;
        font-size: 270px;
        text-anchor: middle;
        dominant-baseline: central;
      }
    </style>
  </defs>
  
  <!-- Outer circle matching the rounded badge brand style -->
  <circle cx="256" cy="256" r="240" class="circle-bg" />
  
  <!-- "VA" Monogram, slightly adjusted to visually center the italicized characters -->
  <text x="250" y="260" class="logo-text">VA</text>
</svg>
